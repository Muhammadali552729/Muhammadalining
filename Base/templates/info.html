<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <title>RoboCode O'yini</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f2c23;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .modal {
            background: #ffffff;
            width: 750px;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0;
            color: #111;
        }

        .header p {
            margin: 5px 0 0 0;
            color: #666;
            font-size: 14px;
        }

        .content {
            display: flex;
            gap: 20px;
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .section-title {
            font-size: 13px;
            font-weight: bold;
            color: #888;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .commands-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            background: #0066ff;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-align: left;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #0052cc;
        }

        .btn-orange {
            background: #ff7b00;
        }

        .btn-orange:hover {
            background: #e06c00;
        }

        .program-box {
            background: #f4f6f8;
            border-radius: 8px;
            padding: 10px;
            min-height: 120px;
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .program-item {
            background: #0066ff;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .program-item.orange {
            background: #ff7b00;
        }

        .program-item .delete-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .actions-footer {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-start {
            background: #0066ff;
            color: white;
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-restart {
            background: #f4f6f8;
            color: #333;
            padding: 12px 16px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        /* O'yin maydoni (Grid) */
        .right-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 55px);
            grid-template-rows: repeat(5, 55px);
            gap: 6px;
            background: #eef2f5;
            padding: 10px;
            border-radius: 12px;
        }

        .cell {
            background: white;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            font-size: 24px;
        }

        .robot {
            color: #0066ff;
            transition: transform 0.3s ease, all 0.3s ease;
        }

        .flag {
            color: #ff4d4d;
        }

        .success-banner {
            margin-top: 10px;
            background: #e1f5fe;
            color: #0288d1;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
    </style>
</head>

<body>

    <div class="modal">
        <div class="header">
            <div>
                <h2>RoboCode O'yini</h2>
                <p>Ro'yxatdan o'tish uchun shaklni matnga olib boring!</p>
            </div>
        </div>

        <div class="content">
            <!-- Chap panel: Buyruqlar va Dastur -->
            <div class="left-panel">
                <div>
                    <div class="section-title">BUYruqlar</div>
                    <div class="commands-grid">
                        <button class="btn" onclick="addCommand('forward', 'Oldinga yurish')">☝️ OLDINGA YURISH</button>
                        <div style="display: flex; gap: 8px;">
                            <button class="btn btn-orange" style="flex:1;"
                                onclick="addCommand('left', 'Chapga burilish')">↶ CHAPGA BURILISH</button>
                            <button class="btn btn-orange" style="flex:1;"
                                onclick="addCommand('right', 'Ongga burilish')">↷ O'NGGA BURILISH</button>
                        </div>
                    </div>
                </div>

                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div class="section-title" style="margin:0;">DASTUR</div>
                        <span id="command-count" style="font-size: 12px; color: #888;">0 ta</span>
                    </div>
                    <div class="program-box" id="program-list">
                        <!-- Buyruqlar shu yerga qo'shiladi -->
                    </div>
                </div>

                <div class="actions-footer">
                    <button class="btn-start" onclick="runProgram()">▶ BOSHJLASH</button>
                    <button class="btn-restart" onclick="resetGame()">🔄 QAYTA</button>
                </div>
            </div>

            <!-- O'ng panel: O'yin maydoni -->
            <div class="right-panel">
                <div class="grid" id="grid">
                    <!-- Kataklar JavaScript orqali generatsiya qilinadi -->
                </div>
                <div id="success-message" class="success-banner">✨ MISSIYA BAJARILDI!</div>
            </div>
        </div>
    </div>

    <script>
        const gridSize = 5;
        let robot = { x: 2, y: 3, dir: 0 }; // dir: 0-yuqori, 1-o'ng, 2-past, 3-chap
        let flag = { x: 4, y: 1 };
        let program = [];

        // Yo'nalishlar uchun strelkalar va burchaklar
        const directions = ['⬆️', '➡️', '⬇️', '⬅️'];

        function initGrid() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';

            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';

                    if (x === robot.x && y === robot.y) {
                        const robotEl = document.createElement('span');
                        robotEl.className = 'robot';
                        robotEl.innerText = directions[robot.dir];
                        cell.appendChild(robotEl);
                    } else if (x === flag.x && y === flag.y) {
                        const flagEl = document.createElement('span');
                        flagEl.className = 'flag';
                        flagEl.innerText = '🚩';
                        cell.appendChild(flagEl);
                    }

                    gridEl.appendChild(cell);
                }
            }
        }

        function addCommand(type, text) {
            if (program.length >= 8) return;
            program.push({ type, text });
            updateProgramUI();
        }

        function removeCommand(index) {
            program.splice(index, 1);
            updateProgramUI();
        }

        function updateProgramUI() {
            const listEl = document.getElementById('program-list');
            listEl.innerHTML = '';

            program.forEach((cmd, idx) => {
                const item = document.createElement('div');
                item.className = `program-item ${cmd.type !== 'forward' ? 'orange' : ''}`;
                item.innerHTML = `<span>${cmd.text}</span> <button class="delete-btn" onclick="removeCommand(${idx})">✕</button>`;
                listEl.appendChild(item);
            });

            document.getElementById('command-count.innerText = `${program.length} ta`lim; // xatolikni oldini olish uchun pastdagi qator ishlatiladi')
            document.getElementById('command-count').innerText = `${program.length} ta'lim;
    }

    function resetGame() {
        robot = { x: 2, y: 3, dir: 0 };
        program = [];
        document.getElementById('success-message').style.display = 'none';
        updateProgramUI();
        initGrid();
    }

    async function runProgram() {
        if (program.length === 0) return;
        
        for (let cmd of program) {
            await new Promise(resolve => setTimeout(resolve, 500)); // Harakatlar orasidagi pauza
            
            if (cmd.type === 'forward') {
                if (robot.dir === 0 && robot.y > 0) robot.y--;
                else if (robot.dir === 1 && robot.x < gridSize - 1) robot.x++;
                else if (robot.dir === 2 && robot.y < gridSize - 1) robot.y++;
                else if (robot.dir === 3 && robot.x > 0) robot.x--;
            } else if (cmd.type === 'left') {
                robot.dir = (robot.dir + 3) % 4;
            } else if (cmd.type === 'right') {
                robot.dir = (robot.dir + 1) % 4;
            }
            initGrid();
        }

        // Tekshirish: robot bayroqqa yetib bordimi?
        if (robot.x === flag.x && robot.y === flag.y) {
            document.getElementById('success-message').style.display = 'block';
        }
    }

    // Ilk yuklanish
    initGrid();
    </script>

</body>

</head>
